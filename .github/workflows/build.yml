name: build

# ⚠️ THE ONLY PLACE THE WINDOWS AND macOS PANELS CAN BE BUILT. There is no Mac and
# no Windows box in this project's development loop, so a desktop change that has
# not run here has not been built at all - and "it compiles on Linux" has already
# been shown tonight to mean nothing: the browser fix crashed the Linux desktop
# app on its first frame while every build was green.

# ⚠️ TAGS, NOT EVERY PUSH. This repo's origin is git.wa0o.com now; GitHub only
# ever receives a release (see tools/release.sh). Building on every push to main
# was billing Actions minutes against a PRIVATE repo's quota for commits nobody
# outside the house could even see - and it exhausted the month's allowance by
# the 5th. A tag is a release, and a release is exactly when installers are
# wanted, so the desktop builds run then without anybody remembering to ask.
on:
  push:
    tags: ['v*']
  # ⚠️ PULL REQUESTS BUILD AGAIN NOW THAT THIS REPO IS PUBLIC. Public repos get
  # unlimited standard runners, so the reason this was removed - a private repo
  # eating its whole month of Actions minutes by the 5th - no longer applies. A
  # public project that does not check the patches people send it is asking
  # contributors to guess.
  pull_request:
  workflow_dispatch:
    inputs:
      desktop:
        description: "Also build the Windows/macOS/Linux desktop panels (macOS bills at 10x)"
        type: boolean
        default: false

jobs:
  # The server. Fast, and it gates everything else.
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # ⚠️ Cheap, and it is the check that would have stopped three installers
      # shipping with somebody else's logo on them. No build needed.
      - name: The app carries the HamDeck mark
        run: python3 tools/check_branding.py
      - uses: actions/setup-go@v5
        with: { go-version: '1.23', cache: true }
      # ⚠️ THE SERVER PACKAGES ONLY, AND NOT ./... - the Gio comparison panel
      # imports Gio, which needs X11, Wayland and xkbcommon HEADERS to even
      # type-check on Linux. Vetting everything made the server's own gate depend
      # on desktop GUI libraries the server will never use, and it failed for a
      # reason that had nothing to do with the server.
      - name: Vet
        run: go vet ./cmd/hamdeck-host/... ./internal/...
      - name: Test
        run: go test ./cmd/hamdeck-host/... ./internal/...

      # The Gio panel is kept as a comparison; WASM needs no system libraries, so
      # this proves it still compiles without dragging GUI headers into the
      # server's gate.
      - name: The comparison panel still builds (wasm)
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/hamdeck-panel
      - name: Build
        run: go build -ldflags "-X main.version=${GITHUB_REF_NAME#v}" ./cmd/hamdeck-host
      # ⚠️ RUN IT, not just build it. A host that compiles and exits on start is a
      # green build and a dead service. This step has already earned its keep: it
      # is what caught the smoke test still calling --hash-password after that
      # flag was deleted.
      - name: It actually starts, serves, and can be logged into
        run: |
          set -eux
          STORE="$RUNNER_TEMP/users.json"
          # ⚠️ THE RECOVERY PATH IS PART OF THE PRODUCT, so CI walks it: create an
          # account with the same command an operator uses when locked out.
          echo 'ci-only-password' | ./hamdeck-host --users "$STORE" users set ci
          ./hamdeck-host --users "$STORE" users list | grep -q '^ci '
          ./hamdeck-host --users "$STORE" --port 5199 &
          sleep 2
          curl -fsS http://127.0.0.1:5199/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          # ⚠️ The boundary HOLDS: status without a session must be 401.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5199/api/status)
          [ "$code" = "401" ] || { echo "status was $code, expected 401 - the auth boundary is open"; exit 1; }
          # ⚠️ And the account actually works, because "it started" says nothing
          # about whether anybody can get in - which is the whole point of a store.
          curl -fsS -X POST http://127.0.0.1:5199/api/auth/login \
               -H 'Content-Type: application/json' \
               -d '{"username":"ci","password":"ci-only-password"}' | grep -q '"token"'
          # ⚠️ A wrong password must be refused. A login check that only ever
          # tries the right password cannot tell a credential from a turnstile.
          bad=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5199/api/auth/login \
               -H 'Content-Type: application/json' \
               -d '{"username":"ci","password":"wrong"}')
          [ "$bad" = "401" ] || { echo "a wrong password answered $bad, expected 401"; exit 1; }

  # ⚠️ DESKTOP BUILDS ARE ASKED FOR, NOT AUTOMATIC, AND THE REASON IS THE BILL.
  # This repo is PRIVATE, so its Actions minutes are billable, and macOS runners
  # bill at 10x and Windows at 2x. Building all three desktops on every push to an
  # experiment is a large invoice for artefacts nobody downloads. Run it when there
  # is something to ship:
  #     gh workflow run build.yml -f desktop=true
  panel:
    # A tag builds the installers; a manual run builds them only if asked,
    # because macOS bills at 10x and Windows at 2x.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.desktop)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,  target: linux,   deps: true }
          - { os: windows-latest, target: windows, deps: false }
          - { os: macos-latest,   target: macos,   deps: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Linux desktop needs GTK
        if: matrix.deps
        run: |
          sudo apt-get update -qq
          # ⚠️ libasound2-dev is REQUIRED: SoLoud compiles its own ALSA backend and
          # needs alsa/asoundlib.h. Without it the Linux panel fails at "Building
          # native assets" while Windows and macOS build fine, so the gap only
          # shows on the one platform this project develops on.
          # ⚠️ libkeybinder-3.0-dev is the global PTT key and
          # libayatana-appindicator3-dev is the tray. Without them the Linux
          # build fails at "Unable to generate build files" while Windows and
          # macOS build fine - so the gap only shows on the one platform this
          # project develops on, which is exactly how the missing
          # libasound2-dev was found.
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libkeybinder-3.0-dev libayatana-appindicator3-dev
      - uses: actions/setup-go@v5
        if: matrix.target == 'linux'
        with: { go-version: '1.23', cache: true }
      - name: Enable the desktop target
        working-directory: client
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Build
        working-directory: client
        run: flutter build ${{ matrix.target }} --release
      # ⚠️ AN INSTALLER, NOT A ZIP. A zip asks the person downloading it to find an
      # exe among a few hundred files and make their own shortcut; nobody does
      # that, and the ones who try pick the wrong file. Every platform gets a
      # real package.
      - name: Windows installer
        if: matrix.target == 'windows'
        working-directory: packaging
        # ⚠️ pwsh, NOT bash. Under MSYS bash the //D argument trick and the
        # forward/back slash mixing mangle every path Inno is given, and iscc
        # fails with an exit code and nothing useful on stdout. The C++ repo
        # solved this the same way; use its shape rather than rediscovering it.
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = "0.0.0" }
          $src = "${{ github.workspace }}\client\build\windows\x64\runner\Release"
          # ⚠️ THE MSVC RUNTIME DLLS SHIP WITH THE APP, and this is not
          # optional. These are Microsoft's Visual C++ redistributable files -
          # needed by every native Windows binary, including this one, because
          # Flutter compiles to native code. ⚠️ Nothing to do with the C++ HOST
          # in the sibling repo, which is our own code and only a reference for
          # this port; the shared "C++" is Microsoft's compiler, not our program.
          #
          # ⚠️ THE WHOLE FOLDER, NOT THREE FILES. Shipping vcruntime140,
          # vcruntime140_1 and msvcp140 was still not enough: the app died with
          # 0xC0000135 on a clean Windows 11 until the full redistributable went
          # on, because the plugins pull in more of the CRT than the three names
          # everybody quotes - msvcp140_1 among them. Guessing the list is how
          # this stayed broken through two builds; copying what Microsoft ships
          # is not.
          $need = @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll")
          $vcDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Directory `
                     -Filter "*CRT" -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match "\\Redist\\" -and $_.FullName -match "\\x64\\" } |
                   Where-Object { $dir = $_.FullName; ($need | Where-Object { Test-Path (Join-Path $dir $_) }).Count -eq 3 } |
                   Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $vcDir) { throw "no folder on this runner holds the C++ runtime redistributable" }
          Write-Host "shipping the MSVC runtime from $($vcDir.FullName)"
          Copy-Item (Join-Path $vcDir.FullName "*.dll") $src -Force
          Get-ChildItem $src -Filter "*140*.dll" | ForEach-Object { Write-Host "  bundled $($_.Name)" }

          # ⚠️ CHECK THE PAYLOAD BEFORE PACKAGING IT. Without the two native
          # audio plugins the panel installs, starts, connects and is silent in
          # both directions - which is far worse than failing to start, because
          # it looks like a radio problem. And without the runtime it does not
          # start at all on a machine that has never had Visual Studio near it.
          foreach ($f in @("hamdeck_panel.exe","flutter_soloud_plugin.dll","record_windows_plugin.dll","hotkey_manager_windows_plugin.dll","tray_manager_plugin.dll","window_manager_plugin.dll","screen_retriever_windows_plugin.dll","vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll")) {
            if (-not (Test-Path "$src\$f")) { throw "the staged panel has no $f" }
          }
          & iscc.exe /Qp "/DAppVersion=$ver" "/DSourceDir=$src" hamdeck-panel.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          if (-not (Test-Path "HamDeck-Panel-Windows-Setup.exe")) { throw "iscc produced no installer" }
          "built HamDeck-Panel-Windows-Setup.exe ($ver)"

      - name: macOS disk image
        if: matrix.target == 'macos'
        working-directory: client
        run: |
          set -eux
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          STAGE="$RUNNER_TEMP/dmg"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          # The alias is what makes drag-to-install obvious without a background
          # image or the .DS_Store fiddling that breaks on a headless runner.
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "HamDeck Panel" -srcfolder "$STAGE" \
                         -ov -format UDZO HamDeck-Panel-macOS.dmg
          ls -l HamDeck-Panel-macOS.dmg

      - name: Debian packages
        if: matrix.target == 'linux'
        run: |
          set -eux
          VER="${GITHUB_REF_NAME#v}"; [ "$VER" = "$GITHUB_REF_NAME" ] && VER=0.0.0
          # ⚠️ The version goes INTO the binary, and build-deb.sh refuses to
          # package one whose --version disagrees with the filename.
          go build -ldflags "-X main.version=$VER" -o hamdeck-host ./cmd/hamdeck-host
          bash packaging/build-deb.sh "$VER"

      - uses: actions/upload-artifact@v4
        with:
          name: panel-${{ matrix.target }}
          path: |
            packaging/HamDeck-Panel-Windows-Setup.exe
            client/HamDeck-Panel-macOS.dmg
            dist/*.deb
            client/build/${{ matrix.target }}/**/Release/**
            client/build/${{ matrix.target }}/x64/release/bundle/**
          if-no-files-found: warn

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build the web panel
        working-directory: client
        run: flutter build web --release
      # ⚠️ THE GATES RUN HERE TOO, NOT ONLY IN tools/preflight.sh. A check that
      # only fires when somebody remembers to run it is a note, not a gate - and
      # the builds that shipped Flutter's own logo as the app icon were all
      # green. This one reads the SHIPPED main.dart.js.
      - name: The browser gets admin only, no operating surface
        run: python3 tools/check_web_is_admin_only.py client/build/web
      - uses: actions/upload-artifact@v4
        with: { name: panel-web, path: client/build/web }
